services:
  # ============================================
  # DATABASE - PostgreSQL
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: SecurePass123!
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # CACHE - Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================
  # MCP GEMINI DEVTOOLS SERVER ✅ TES OUTILS RÉELS
  # ============================================
  ecommerce-mcp:
    build:
      context: ./mcp-gemini-server
      dockerfile: Dockerfile
    container_name: ecommerce_mcp_gemini
    ports:
      - "3001:8080"                    # ← EXTÉRIEUR :3001
    volumes:
      - ./mcp-gemini-server:/app       # ← Hot-reload
    depends_on:
      postgres:
        condition: service_healthy     # ← ATTEND DB
      redis:
        condition: service_healthy     # ← ATTEND REDIS
    networks:
      - ecommerce-network              # ← RÉSEAU INTERNE
    restart: unless-stopped
    environment:
      # ✅ TES OUTILS DB → PostgreSQL DOCKER
      - DB_CONNECTION=postgresql://ecommerce_user:SecurePass123!@postgres:5432/ecommerce_db
      # ✅ TES OUTILS API → Backend externe
      - API_HOST=http://host.docker.internal:5000
      # ✅ TES OUTILS REDIS → Docker interne
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  postgres_data:
    driver: local

networks:
  ecommerce-network:
    driver: bridge